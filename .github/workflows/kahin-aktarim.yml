          +      : 'İlk tur için bir kart seç.';
          +    get('seer-hand').innerHTML = ranks.map((rank) => `
          +      <button type="button" class="seer-card seer-${colorOf(rank)}" data-seer-card="${rank}"
          +        aria-label="${rank}, ${colors[colorOf(rank)]}${used.has(rank) ? ', oynandı' : ''}" ${used.has(rank) ? 'disabled' : ''}>${rank}</button>`
          +    ).join('');
          +    renderRounds(get('seer-game-history'), game.rounds, info, finished ? game.deck : null);
          +    renderRemaining(get('seer-game-remaining'), info.remaining);
          +  }
          +
          +  get('seer-hand').addEventListener('click', (event) => {
          +    const button = event.target.closest('[data-seer-card]');
          +    if (!button) return;
          +    const result = play(game, Number(button.dataset.seerCard));
          +    if (!result) return;
          +    const total = score(game.rounds);
          +    const finishWin = game.rounds.length === ranks.length && total.own > total.rival;
          +    GameSound.play(finishWin ? 'win' : result.relation === 'lower' ? 'point' : result.relation === 'equal' ? 'tie' : 'miss');
          +    renderGame();
          +    if (event.detail === 0) (get('seer-hand').querySelector('button:not(:disabled)') || get('seer-new-game')).focus({ preventScroll: true });
          +  });
          +
          +  get('seer-new-game').addEventListener('click', () => {
          +    game = createGame();
          +    renderGame();
          +    GameSound.play('deal');
          +  });
          +
          +  renderNotes();
          +  renderGame();
          +})();
          diff --git a/seer.js b/seer.js
          new file mode 100644
          index 0000000..9940500
          --- /dev/null
          +++ b/seer.js
          @@ -0,0 +1,80 @@
          +'use strict';
          +
          +const Seer = (() => {
          +  const ranks = Object.freeze(Array.from({ length: 9 }, (_, index) => index));
          +  const colors = Object.freeze({ black: 'Siyah', white: 'Beyaz' });
          +  const relations = Object.freeze({ lower: 'Rakip daha düşük', equal: 'Eşit', higher: 'Rakip daha yüksek' });
          +  const colorOf = (rank) => rank % 2 === 0 ? 'black' : 'white';
          +  const relationOf = (own, rival) => rival < own ? 'lower' : rival > own ? 'higher' : 'equal';
          +
          +  function createGame(random = Math.random) {
          +    const deck = [...ranks];
          +    for (let i = deck.length - 1; i > 0; i--) {
          +      const j = Math.floor(random() * (i + 1));
          +      [deck[i], deck[j]] = [deck[j], deck[i]];
          +    }
          +    return { deck, rounds: [] };
          +  }
          +
          +  function play(game, own) {
          +    if (!ranks.includes(own) || game.rounds.length >= ranks.length ||
          +        game.rounds.some((round) => round.own === own)) return null;
          +    const rival = game.deck[game.rounds.length];
          +    const round = { own, color: colorOf(rival), relation: relationOf(own, rival) };
          +    game.rounds.push(round);
          +    return round;
          +  }
          +
          +  function score(rounds) {
          +    let own = 0;
          +    let rival = 0;
          +    for (const round of rounds) {
          +      if (round.relation === 'lower') own++;
          +      if (round.relation === 'higher') rival++;
          +    }
          +    return { own, rival, coins: own + Math.max(0, own - rival) };
          +  }
          +
          +  function analyze(rounds) {
          +    const options = rounds.map(({ own, color, relation }) =>
          +      ranks.filter((rank) => colorOf(rank) === color && relationOf(own, rank) === relation)
          +    );
          +    const memo = new Map();
          +    function possible(index, used) {
          +      if (index === options.length) return true;
          +      const key = (index << ranks.length) | used;
          +      if (!memo.has(key)) {
          +        memo.set(key, options[index].some((rank) => {
          +          const bit = 1 << rank;
          +          return !(used & bit) && possible(index + 1, used | bit);
          +        }));
          +      }
          +      return memo.get(key);
          +    }
          +
          +    if (!possible(0, 0)) return null;
          +    let states = new Set([0]);
          +    const byRound = options.map((candidates, index) => {
          +      const next = new Set();
          +      const valid = candidates.filter((rank) => {
          +        const bit = 1 << rank;
          +        let fits = false;
          +        for (const used of states) {
          +          if (!(used & bit) && possible(index + 1, used | bit)) {
          +            next.add(used | bit);
          +            fits = true;
          +          }
          +        }
          +        return fits;
          +      });
          +      states = next;
          +      return valid;
          +    });
          +    const remaining = ranks.filter((rank) => [...states].some((used) => !(used & (1 << rank))));
          +    return { byRound, remaining };
          +  }
          +
          +  return { ranks, colors, relations, colorOf, createGame, play, score, analyze };
          +})();
          +
          +if (typeof module !== 'undefined') module.exports = Seer;
          diff --git a/sound.js b/sound.js
          new file mode 100644
          index 0000000..c67045a
          --- /dev/null
          +++ b/sound.js
          @@ -0,0 +1,63 @@
          +'use strict';
          +
          +const GameSound = (() => {
          +  const button = document.getElementById('sound-toggle');
          +  const storageKey = 'hec-game-sound-v1';
          +  let enabled = readPreference();
          +  let context;
          +
          +  const effects = {
          +    card: [[230, 0, .075, .045, 'triangle']],
          +    deal: [[250, 0, .065, .04, 'triangle'], [370, .055, .085, .035, 'triangle']],
          +    discard: [[185, 0, .12, .045, 'triangle']],
          +    point: [[523, 0, .125, .055, 'sine'], [659, .075, .16, .05, 'sine']],
          +    win: [[523, 0, .15, .055, 'sine'], [659, .08, .15, .05, 'sine'], [784, .16, .22, .045, 'sine']],
          +    miss: [[277, 0, .11, .04, 'triangle'], [196, .08, .14, .045, 'sine']],
          +    tie: [[330, 0, .105, .04, 'sine'], [330, .10, .11, .025, 'sine']],
          +    trap: [[220, 0, .12, .055, 'triangle'], [147, .08, .19, .05, 'triangle']],
          +  };
          +
          +  function readPreference() {
          +    try { return localStorage.getItem(storageKey) !== 'off'; }
          +    catch { return true; }
          +  }
          +
          +  function updateButton() {
          +    button.setAttribute('aria-pressed', enabled);
          +    button.querySelector('span').textContent = enabled ? 'Ses açık' : 'Ses kapalı';
          +  }
          +
          +  function play(effect) {
          +    const Audio = window.AudioContext || window.webkitAudioContext;
          +    if (!enabled || !Audio || !effects[effect]) return;
          +    try {
          +      context ||= new Audio();
          +      if (context.state === 'suspended') context.resume().catch(() => {});
          +      const now = context.currentTime;
          +      for (const [pitch, offset, duration, volume, wave] of effects[effect]) {
          +        const tone = context.createOscillator();
          +        const gain = context.createGain();
          +        const start = now + offset;
          +        tone.type = wave;
          +        tone.frequency.setValueAtTime(pitch, start);
          +        gain.gain.setValueAtTime(.001, start);
          +        gain.gain.exponentialRampToValueAtTime(volume, start + .012);
          +        gain.gain.exponentialRampToValueAtTime(.001, start + duration);
          +        tone.connect(gain);
          +        gain.connect(context.destination);
          +        tone.start(start);
          +        tone.stop(start + duration);
          +      }
          +    } catch { /* Gameplay remains available if audio is blocked. */ }
          +  }
          +
          +  button.addEventListener('click', () => {
          +    enabled = !enabled;
          +    try { localStorage.setItem(storageKey, enabled ? 'on' : 'off'); } catch {}
          +    updateButton();
          +    if (enabled) play('card');
          +    else if (context?.state === 'running') context.suspend().catch(() => {});
          +  });
          +  updateButton();
          +  return { play };
          +})();
